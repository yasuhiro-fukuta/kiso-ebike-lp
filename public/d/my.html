<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<script>window.DOLPHIN_API="https://script.google.com/macros/s/AKfycbzAHy-91-MQKFuvUXNWoZK_DNzKhHXIWj_XxtZIBgNFLlfiaw_VWuNL5mZLz-QpcBcR/exec";</script>
<!-- 正本は dolphin リポジトリ web/my.html。直すときはそちらを直してから写す -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your reservation — Beyond Nakasendo</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1e1f1c; --mut:#6b6e66; --line:#dcdcd3; --acc:#2f6b4f; --bad:#a33; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181a; --fg:#ecece6; --mut:#9a9d95; --line:#33362f; --acc:#6cc39a; --bad:#e88; --warn:#e0b050; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 12px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  .lang { display:flex; gap:4px; } .lang button { padding:4px 10px; font-size:13px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:8px; font-family:inherit; }
  .lang button[aria-pressed=true] { border-color:var(--acc); color:var(--acc); }
  .card { margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:10px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; border:1px solid var(--acc); color:var(--acc); font-weight:700; }
  .badge.warn { border-color:var(--warn); color:var(--warn); } .badge.bad { border-color:var(--bad); color:var(--bad); }
  dl { margin:10px 0 0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; } dt { color:var(--mut); font-size:14px; } dd { margin:0; }
  .note { font-size:14px; color:var(--mut); margin-top:8px; }
  .keybox { text-align:center; font-size:36px; font-weight:800; letter-spacing:.2em; margin:6px 0; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btns a { flex:1; text-align:center; padding:13px 6px; border-radius:10px; text-decoration:none; font-weight:700; border:1px solid var(--acc); color:var(--acc); }
  .btns a.main { background:var(--acc); color:var(--bg); }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <div class="row"><h1 id="title"></h1><div class="lang"><button data-l="en">EN</button><button data-l="ja">日本語</button></div></div>
  <div id="msg" class="note"></div>
  <div id="view" class="hide">
    <div class="card"><span id="badge" class="badge"></span><div id="stagenote" class="note"></div>
      <dl id="dl"></dl></div>
    <div class="card hide" id="keycard"><strong id="keytitle"></strong><div id="keyno" class="keybox"></div><div id="keynote" class="note"></div></div>
    <div class="card hide" id="photocard"><strong id="phototitle"></strong><div id="photonote" class="note"></div>
      <label class="btns" id="photobtnwrap"><a id="photobtn" class="main" role="button" tabindex="0"></a></label>
      <input id="photoin" type="file" accept="image/*" capture="environment" class="hide">
      <div id="photomsg" class="note"></div></div>
    <div class="card"><strong id="helptitle"></strong>
      <div class="btns"><a id="tel" class="main"></a><a id="wa" target="_blank" rel="noopener">WhatsApp</a></div></div>
    <div class="note" id="idnote"></div>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const API = q.get('api_base') || window.DOLPHIN_API || '';
const K = (q.get('k') || '').toLowerCase();
const $ = id => document.getElementById(id);
const T = {
  en: { title:'Your reservation', loading:'Loading…', nf:'We could not find this reservation. Please open the link in your email again.', ng:'Could not load. Please try again later.',
    paidOk:'Thank you — we have your payment.', prod:{ LUGGAGE:'Luggage transfer', EBIKE_RENTAL:'E-bike rental', GUIDE_DOWNHILL:'Kiso River Downhill guide' },
    stage:{ '仮押さえ':['Held — waiting for payment','warn','Held until {e}. Please pay before then to confirm.'], '承認待ち':['Payment received — confirming','warn','We are checking availability and will email you within 24 hours.'],
      '受付済':['Confirmed','','See you soon!'], 'お断り':['Not accepted','bad','Sorry, we could not accept this request. Your payment (if any) is refunded — see your email.'], '破棄':['Expired','bad','The hold expired. Please make a new reservation.'],
      '取消':['Cancelled','bad',''], '運休':['Cancelled (weather)','bad','This day is cancelled. See your email for the refund.'] },
    f:{ no:'Reservation no.', date:'Date', time:'Time', qty:'Quantity', people:'People', from:'From', to:'To', amt:'Amount', pay:'Payment' },
    pay:{ paid:'Paid', unpaid:'Not paid yet', refunded:'Refunded', refund_pending:'Refund in progress', none:'—' },
    keyt:'E-bike key number', keyLater:'Your key number will appear here on the day of your ride.', keyPending:'Your key number is being prepared. Please call us.', keyHint:'Use this number to unlock your bike.',
    phT:'Return photo', phOpen:'After locking the bike at the return spot, take one photo of the bike and the lock and send it here. That completes your return — no reply needed.', phDone:'Photo received ({n}). Thank you!', phBtn:'Take / choose a photo', phMore:'Send another photo', phSending:'Sending…', phOk:'Received — thank you! Your return is complete.', phNg:'Could not send. Please try again, or send the photo on WhatsApp.', phLimit:'We already have enough photos. Thank you!',
    help:'Need help? Contact us', call:'Call', note:'Keep this link private — anyone with it can see this page.' },
  ja: { title:'ご予約の確認', loading:'読み込み中…', nf:'ご予約が見つかりません。メールのリンクをもう一度開いてください。', ng:'読み込めませんでした。しばらくしてからもう一度お試しください。',
    paidOk:'お支払いを確認しました。ありがとうございます。', prod:{ LUGGAGE:'荷物運び', EBIKE_RENTAL:'E-bikeレンタル', GUIDE_DOWNHILL:'木曽川ダウンヒルガイド' },
    stage:{ '仮押さえ':['仮押さえ中（お支払い待ち）','warn','{e} までお取りしています。それまでにお支払いください。'], '承認待ち':['お支払い済み・確認中','warn','空き状況を確認し、24時間以内にメールでご連絡します。'],
      '受付済':['予約確定','','当日お会いできるのを楽しみにしています。'], 'お断り':['お受けできませんでした','bad','申し訳ありません。お支払い済みの場合は返金します（メールをご確認ください）。'], '破棄':['期限切れ','bad','仮押さえの期限が過ぎました。もう一度ご予約ください。'],
      '取消':['取消','bad',''], '運休':['運休','bad','この日は運休です。返金はメールをご確認ください。'] },
    f:{ no:'予約番号', date:'日付', time:'時間', qty:'数量', people:'人数', from:'受取先', to:'届け先', amt:'金額', pay:'お支払い' },
    pay:{ paid:'お支払い済み', unpaid:'未払い', refunded:'返金済み', refund_pending:'返金手続き中', none:'—' },
    keyt:'E-bike 鍵番号', keyLater:'鍵番号は、ご利用当日にここに表示されます。', keyPending:'鍵番号を準備中です。お電話ください。', keyHint:'この番号で自転車の鍵を開けてください。',
    phT:'返却の写真', phOpen:'返却場所で鍵をかけたら、自転車と鍵が写るように1枚撮ってここから送ってください。これで返却完了です（返信は不要です）。', phDone:'写真を受け取りました（{n}枚）。ありがとうございました。', phBtn:'写真を撮る／選ぶ', phMore:'もう1枚送る', phSending:'送信中…', phOk:'受け取りました。返却完了です。ありがとうございました。', phNg:'送れませんでした。もう一度お試しいただくか、WhatsAppで写真を送ってください。', phLimit:'写真は十分いただきました。ありがとうございました。',
    help:'お困りのときはご連絡ください', call:'電話する', note:'このリンクは他の人に見せないでください（リンクを知っている人は、このページを見られます）。' },
};
let lang = 'en', data = null;
function row(dl, k, v) { if (v === '' || v === null || v === undefined) return; const a = document.createElement('dt'), b = document.createElement('dd'); a.textContent = k; b.textContent = v; dl.append(a, b); }
function paint() {
  const t = T[lang]; document.documentElement.lang = lang; $('title').textContent = t.title;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  if (!data) return;
  const d = data, st = t.stage[d.stage] || [d.stage, '', ''];
  $('badge').textContent = st[0]; $('badge').className = 'badge ' + st[1];
  $('stagenote').textContent = (q.get('paid') === '1' && d.pay === 'paid' ? t.paidOk + ' ' : '') + st[2].replace('{e}', (d.expires || '').slice(11));
  const dl = $('dl'); dl.textContent = '';
  row(dl, t.f.no, d.id); row(dl, '', t.prod[d.product] || d.product);
  row(dl, t.f.date, d.ymd); row(dl, t.f.time, d.start ? d.start + (d.end ? '–' + d.end : '') : '');
  row(dl, d.product === 'GUIDE_DOWNHILL' ? t.f.people : t.f.qty, d.product === 'GUIDE_DOWNHILL' ? d.people : d.qty);
  row(dl, t.f.from, d.pickupName); row(dl, t.f.to, d.dropName);
  row(dl, t.f.amt, d.amount === null ? '' : '¥' + d.amount.toLocaleString('en-US')); row(dl, t.f.pay, t.pay[d.pay] || '');
  const kc = $('keycard'); kc.classList.toggle('hide', d.keyState === 'none'); $('keytitle').textContent = t.keyt;
  $('keyno').textContent = d.keyState === 'show' ? d.key : ''; $('keyno').classList.toggle('hide', d.keyState !== 'show');
  $('keynote').textContent = d.keyState === 'show' ? t.keyHint : d.keyState === 'pending' ? t.keyPending : t.keyLater;
  const pc = $('photocard'); pc.classList.toggle('hide', d.photo !== 'open' && d.photo !== 'done');
  $('phototitle').textContent = t.phT;
  $('photonote').textContent = d.photo === 'open' && !d.photos ? t.phOpen : t.phDone.replace('{n}', d.photos || 0);
  $('photobtnwrap').classList.toggle('hide', d.photo !== 'open'); $('photobtn').textContent = d.photos ? t.phMore : t.phBtn;
  $('helptitle').textContent = t.help;
  const ph = /^\+\d{8,15}$/.test(d.phone || '') ? d.phone : '';
  $('tel').classList.toggle('hide', !ph); $('wa').classList.toggle('hide', !ph);
  if (ph) { $('tel').textContent = t.call; $('tel').href = 'tel:' + ph; $('wa').href = 'https://wa.me/' + ph.slice(1); }
  $('idnote').textContent = t.note;
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; paint(); });
// 返却写真：長辺1600pxのJPEGに縮めて送る（通信量とHEIC対策）
function shrink(file) {
  return new Promise((ok, ng) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error('img')); };
    img.src = url;
  });
}
$('photobtn').onclick = () => $('photoin').click();
$('photobtn').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') $('photoin').click(); };
$('photoin').onchange = async () => {
  const f = $('photoin').files[0]; if (!f) return;
  const t = T[lang]; $('photomsg').textContent = t.phSending; $('photobtnwrap').classList.add('hide');
  try {
    const img64 = await shrink(f);
    const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ api: 'photo', k: K, mime: 'image/jpeg', data: img64 }), headers: { 'Content-Type': 'text/plain' } })).json();
    if (r.ok) { data.photos = r.count; data.photo = r.count >= 5 ? 'done' : 'open'; paint(); $('photomsg').textContent = t.phOk; }
    else { $('photomsg').textContent = r.reason === 'limit' ? t.phLimit : t.phNg; $('photobtnwrap').classList.toggle('hide', r.reason === 'limit'); }
  } catch (e) { $('photomsg').textContent = t.phNg; $('photobtnwrap').classList.remove('hide'); }
  $('photoin').value = '';
};
(async () => {
  paint(); $('msg').textContent = T[lang].loading;
  try {
    if (!API || !/^[0-9a-f]{40}$/.test(K)) throw new Error('nf');
    const r = await (await fetch(API + '?' + new URLSearchParams({ api: 'my', k: K }))).json();
    if (!r.ok) throw new Error('nf');
    data = r; lang = r.lang === 'ja' ? 'ja' : 'en'; $('msg').textContent = ''; $('view').classList.remove('hide'); paint();
  } catch (e) { $('msg').textContent = T[lang][e.message === 'nf' ? 'nf' : 'ng']; }
})();
</script>
</body>
</html>
